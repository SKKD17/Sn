<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snoopy et le bouquet</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #f0f0f0; font-family: Helvetica, Arial, sans-serif; }
  #wrap { position: relative; width: 800px; max-width: 100%; }
  canvas { width: 100%; display: block; border-radius: 8px; }
  #open { display: none; position: absolute; top: 10px; left: 50%; width: 360px; max-width: 94%;
          transform: translateX(-50%); }
  #open.pop { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) scale(.2); opacity: 0; }
                   to   { transform: translateX(-50%) scale(1);  opacity: 1; } }
  #letter { box-sizing: border-box; min-height: 100px; background: #fffdf5; border: 3px solid #b89d6a;
            border-radius: 8px; padding: 12px 14px; text-align: center; display: flex;
            flex-direction: column; justify-content: center; opacity: 0; transform: scale(.7);
            transition: opacity .5s .3s, transform .5s .3s; }
  #open.opened #letter { opacity: 1; transform: none; }
  #letter.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  #txt { margin: 0 0 8px; font-size: 16px; font-weight: bold; color: #3b2f2a; }
  #txt.final { margin: 0; font-size: 16px; color: #c2185b; line-height: 1.3; }
  #btns button { font-size: 16px; padding: 5px 22px; margin: 0 8px; cursor: pointer; }
  #note { margin: 8px 0 0; font-style: italic; color: #c2185b; font-size: 15px; }
  #note:empty { display: none; }
  #halves { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .half { position: absolute; top: 0; width: 50%; height: 100%; overflow: hidden;
          transition: transform .7s ease-in, opacity .7s ease-in; }
  .half svg { width: 200%; height: 100%; display: block; }
  #hl { left: 0; } #hr { right: 0; } #hr svg { margin-left: -100%; }
  #open.opened #hl { transform: translateX(-80%) rotate(-14deg); opacity: 0; }
  #open.opened #hr { transform: translateX(80%) rotate(14deg); opacity: 0; }

  #snd { position: absolute; top: 8px; right: 8px; z-index: 5; border: 0; border-radius: 18px; padding: 6px 12px;
         background: rgba(255,255,255,.78); font-size: 15px; cursor: pointer; }
  #replay { display: none; position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5;
            font-size: 17px; padding: 10px 26px; border: 0; border-radius: 24px; background: #c2185b; color: #fff;
            cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  #replay.show { display: block; animation: fadein .8s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  canvas { -webkit-tap-highlight-color: transparent; }
  button { touch-action: manipulation; }
  @media (max-width: 640px) {            /* version téléphone : vue recadrée sur l'action, lettre sous l'image */
    body { align-items: flex-start; }
    canvas { height: 74vw; object-fit: cover; border-radius: 0; }
    #open { position: relative; top: auto; left: auto; transform: none; width: calc(100% - 24px); max-width: 420px; margin: 12px auto; }
    #open.pop { animation: popm .5s ease-out; }
    @keyframes popm { from { transform: scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
    #btns button { font-size: 18px; padding: 10px 28px; }
    #txt, #txt.final { font-size: 17px; }
    #replay { position: static; transform: none; margin: 14px auto; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="450"></canvas>
  <div id="open">
    <div id="halves">
      <div class="half" id="hl"><svg viewBox="0 0 360 100" preserveAspectRatio="none"><rect x="1.5" y="1.5" width="357" height="97" rx="7" fill="#f7ecd0" stroke="#a98a55" stroke-width="3"/><path d="M1.5 98.5 L140 50 M358.5 98.5 L220 50" stroke="#a98a55" stroke-width="2" fill="none"/><path d="M1.5 1.5 L180 58 L358.5 1.5 Z" fill="#efdfb8" stroke="#a98a55" stroke-width="3" stroke-linejoin="round"/><circle cx="180" cy="58" r="13" fill="#d32f2f"/><text x="180" y="64" text-anchor="middle" font-size="16" fill="#fff">♥</text></svg></div>
      <div class="half" id="hr"><svg viewBox="0 0 360 100" preserveAspectRatio="none"><rect x="1.5" y="1.5" width="357" height="97" rx="7" fill="#f7ecd0" stroke="#a98a55" stroke-width="3"/><path d="M1.5 98.5 L140 50 M358.5 98.5 L220 50" stroke="#a98a55" stroke-width="2" fill="none"/><path d="M1.5 1.5 L180 58 L358.5 1.5 Z" fill="#efdfb8" stroke="#a98a55" stroke-width="3" stroke-linejoin="round"/><circle cx="180" cy="58" r="13" fill="#d32f2f"/><text x="180" y="64" text-anchor="middle" font-size="16" fill="#fff">♥</text></svg></div>
    </div>
    <div id="letter">
      <p id="txt">Acceptes-tu ce bouquet de myosotis ?</p>
      <div id="btns"><button id="oui">Oui</button><button id="non">Non</button></div>
      <p id="note"></p>
    </div>
  </div>
  <button id="snd" aria-label="Son">🔇 Son</button>
  <button id="replay">↻ Rejouer</button>
</div>

let x = -120, t = 0, amp = 0, state = 'climb', timer = 0, hop = 0, tilt = 0;
let nF = 0, pt = 0, hasB = false, envOn = false;   // fleurs cueillies, minuteur, bouquet en gueule, enveloppe attachée
let qx = 0, qy = 0, qphi = HELD, vy = 0, bounces = 0, hearts = [];
let gAng = 0, pickTh = 0, tilt0 = 0, pickBack = 'climb', dust = [];      // pente sous les pieds, cueillette en cours, poussière des pas

// ---------- oiseaux dans le ciel ----------
const birds = Array.from({ length: 9 }, () => ({
  x: Math.random() * W, y: 30 + Math.random() * 170, v: 0.5 + Math.random() * 1.1,
  s: 6 + Math.random() * 9, p: Math.random() * 6.28, f: 0.1 + Math.random() * 0.06
}));
function updateBirds() {
  birds.forEach(b => {
    b.x += b.v; b.p += b.f; b.y += Math.sin(b.p * 0.5) * 0.15;
    if (b.x > W + 30) { b.x = -30; b.y = 30 + Math.random() * 170; }
  });
}
function drawBirds() {
  ctx.strokeStyle = '#2b3550'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  birds.forEach(b => {
    const w = Math.sin(b.p) * b.s * 0.55;           // battement d'ailes
    ctx.globalAlpha = b.s < 10 ? 0.65 : 0.95;       // les plus petits sont plus loin
    ctx.lineWidth = Math.max(1.6, b.s * 0.22);
    ctx.beginPath();
    ctx.moveTo(b.x - b.s, b.y - w);
    ctx.quadraticCurveTo(b.x - b.s * 0.45, b.y - b.s * 0.45 + w * 0.3, b.x, b.y);
    ctx.quadraticCurveTo(b.x + b.s * 0.45, b.y - b.s * 0.45 + w * 0.3, b.x + b.s, b.y - w);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

// ---------- décor ----------
// ---------- décor (dessiné une seule fois, puis recopié) ----------
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
const bctx = bg.getContext('2d');
const TITAN_X = 700;
const topY = x => 175;                               // sommet du mur : même hauteur partout

function cloud(c, x, y, s) {
  [[0, 0, 34], [34, -12, 40], [72, -2, 34], [106, 6, 26], [-30, 8, 26]].forEach(([dx, dy, r]) => {
    c.beginPath(); c.ellipse(x + dx * s, y + dy * s, r * s, r * 0.62 * s, 0, 0, 7); c.fill();
  });
}

function titanOld(c) {                                  // le Titan Colossal regarde par-dessus le mur
  const x = TITAN_X, y = topY(x) - 20;
  c.fillStyle = '#b8473a'; c.beginPath(); c.ellipse(x, y + 30, 46, 34, 0, 0, 7); c.fill();   // épaules
  c.fillStyle = '#c8553d'; c.strokeStyle = '#7a2a20'; c.lineWidth = 1.5;
  c.beginPath(); c.ellipse(x, y, 21, 27, 0, 0, 7); c.fill(); c.stroke();                      // tête
  c.lineWidth = 1.2;                                                                          // muscles
  [[-12, -14, -4, -24], [12, -14, 4, -24], [-16, 0, -12, 12], [16, 0, 12, 12]].forEach(([a, b, d, e]) => {
    c.beginPath(); c.moveTo(x + a, y + b); c.quadraticCurveTo(x + (a + d) / 2 * 1.1, y + (b + e) / 2, x + d, y + e); c.stroke();
  });
  c.fillStyle = '#2a1010';                                                                    // orbites
  [-8, 8].forEach(dx => { c.beginPath(); c.ellipse(x + dx, y - 4, 5, 4, 0, 0, 7); c.fill(); });
  c.fillStyle = '#fff';
  [-8, 8].forEach(dx => { c.beginPath(); c.arc(x + dx, y - 4, 1.3, 0, 7); c.fill(); });
  c.fillStyle = '#f3ecd8'; c.fillRect(x - 13, y + 10, 26, 8);                                 // dents
  c.strokeStyle = '#7a2a20'; c.lineWidth = 1;
  for (let i = -12; i <= 12; i += 4) { c.beginPath(); c.moveTo(x + i, y + 10); c.lineTo(x + i, y + 18); c.stroke(); }
}

function wall(c) {                                   // mur Maria + porte de Shiganshina
  const T = topY(0);
  const poly = () => { c.beginPath(); c.moveTo(0, T); c.lineTo(W, T); c.lineTo(W, GROUND); c.lineTo(0, GROUND); c.closePath(); };
  const gr = c.createLinearGradient(0, T, 0, GROUND);
  gr.addColorStop(0, '#b3ad92'); gr.addColorStop(0.5, '#8e8c74'); gr.addColorStop(1, '#6a6a56');
  poly(); c.fillStyle = gr; c.fill();
  c.save(); poly(); c.clip();

  c.fillStyle = '#d9cf9e'; c.fillRect(0, T - 3, W, 3);
  c.fillStyle = 'rgba(30,30,20,0.35)';
  for (let xx = 0; xx < W; xx += 24) c.fillRect(xx + 6, T + 9, 10, 4);
  for (let xx = 40; xx < W; xx += 96) {                                        // contreforts en relief

const CHIM = [];                                     // cheminées qui fument
function houses(c) {                                 // quartier : étages en surplomb, toits de tuiles, volets, brume
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const pick = a => a[Math.floor(rnd() * a.length)];
  [[0.6, 0.22, 24], [0.9, 0.1, 12], [1.2, 0, 0]].forEach(([sc, haze, lift]) => {
    const base = GROUND - lift;

    c.fillRect(0, base - 6, 524, 6 + lift); c.fillRect(676, base - 6, W - 676, 6 + lift);
    for (let xx = -30; xx < W; xx += (26 + rnd() * 22) * sc + 6) {
      if (xx > 470 && xx < 676) continue;                                      // place devant la porte
      const w = (46 + rnd() * 26) * sc, hh = (24 + rnd() * 16) * sc, rh = w * (0.42 + rnd() * 0.16);
      const two = rnd() > 0.55, up = two ? hh * 0.55 : 0, y = base - hh, ry = y - up, o = two ? 3 * sc : 0;
      const wallC = pick(['#dccdae', '#d2c19c', '#e4d7ba', '#c9b48e']);
      c.fillStyle = wallC; c.fillRect(xx, y, w, hh);
      if (two) c.fillRect(xx - o, ry, w + 2 * o, up + 1);                      // étage en surplomb
      c.strokeStyle = '#4a3a2c'; c.lineWidth = 2 * sc; c.beginPath();          // colombages + croix
      c.moveTo(xx, y + hh * 0.45); c.lineTo(xx + w, y + hh * 0.45);
      [0.33, 0.66].forEach(f => { c.moveTo(xx + w * f, ry); c.lineTo(xx + w * f, base); });
      c.moveTo(xx, y); c.lineTo(xx + w * 0.33, y + hh * 0.45); c.moveTo(xx + w * 0.33, y); c.lineTo(xx, y + hh * 0.45);
      if (two) { c.moveTo(xx - o, y); c.lineTo(xx + w + o, y); }
      c.stroke();
      [0.07, 0.4, 0.73].forEach(f => {                                         // fenêtres (certaines éclairées) + volets
        c.fillStyle = rnd() > 0.6 ? '#f3c96b' : '#3d3025'; c.fillRect(xx + w * f, y + hh * 0.1, w * 0.18, hh * 0.25);
        c.fillStyle = '#7a3b2a'; c.fillRect(xx + w * f - w * 0.04, y + hh * 0.1, w * 0.04, hh * 0.25);
        c.fillRect(xx + w * (f + 0.18), y + hh * 0.1, w * 0.04, hh * 0.25);

function drawSmoke() {                               // fumée des cheminées, poussée par le vent

function bloom(c, x, y, R, n, petal, edge, centre) {          // petite fleur vue de face

// ---------- vent : souffle de la droite vers la gauche, par rafales qui traversent l'écran ----------
const wind = xx => -(0.55 + 0.35 * Math.sin(t * 0.035 - xx * 0.004) + 0.25 * Math.sin(t * 0.11 - xx * 0.012 + 1.7));

const GRP = Array.from({ length: 12 }, () => []), FLW = [];       // brins d'herbe (12 lots couleur/épaisseur) et fleurs
const GREENS = ['#9ad065', '#6fae45', '#4c8a2e', '#5f9a3a'], TIER_W = [1.1, 1.7, 2.3];
(function buildMeadow() {
  let seed = 5; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const add = (x, y, len, lean) => {
    const d = (y - GROUND) / (H - GROUND), ci = Math.floor(rnd() * 4), tr = d < 0.33 ? 0 : d < 0.66 ? 1 : 2;
    GRP[ci * 3 + tr].push({ x, y, len, lean, ph: rnd() * 6.28 });
  };
  for (let x = 0; x < W; x += 3) add(x + rnd() * 3, GROUND + 1, 4 + rnd() * 6, (rnd() - 0.5) * 5);      // lisière
  for (let i = 0; i < 520; i++) {                                                                       // brins
    const y = GROUND + 4 + Math.pow(rnd(), 0.9) * (H - GROUND - 6), d = (y - GROUND) / (H - GROUND);
    add(rnd() * W, y, 5 + d * 13 + rnd() * 5, (rnd() - 0.5) * 7);
  }
  for (let i = 0; i < 26; i++) {                                                                        // touffes
    const x = rnd() * W, y = GROUND + 10 + rnd() * (H - GROUND - 14), d = (y - GROUND) / (H - GROUND);
    for (let k = -2; k <= 2; k++) add(x + k * 2, y, 8 + d * 14 + rnd() * 5, k * 3 + (rnd() - 0.5) * 3);
  }
  for (let i = 0; i < 46; i++) {
    const x = rnd() * W, y = GROUND + 14 + rnd() * (H - GROUND - 22);
    if (x > 380 && x < 530 && y > 405) continue;              // place pour l'enveloppe
    FLW.push({ x, y, r: rnd(), kind: Math.floor(rnd() * 4), ph: rnd() * 6.28 });
  }
  FLW.sort((a, b) => a.y - b.y);                               // du fond vers l'avant
})();

function drawMeadow() {                                        // herbe et fleurs qui ondulent
  ctx.lineCap = 'round';
  GRP.forEach((grp, j) => {
    ctx.beginPath();
    grp.forEach(b => {
      const sw = wind(b.x) * b.len * 0.9 + Math.sin(t * 0.2 + b.ph) * b.len * 0.12, tx = b.x + b.lean + sw;
      ctx.moveTo(b.x, b.y); ctx.quadraticCurveTo(b.x + (b.lean + sw) * 0.3, b.y - b.len * 0.6, tx, b.y - b.len * 0.95);
    });
    ctx.strokeStyle = GREENS[Math.floor(j / 3)]; ctx.lineWidth = TIER_W[j % 3]; ctx.stroke();
  });
  FLW.forEach(f => {
    const d = (f.y - GROUND) / (H - GROUND), R = 5 + d * 7, stem = 8 + d * 14 + f.r * 6, lean = (f.r - 0.5) * 8;
    const sw = wind(f.x) * stem * 0.9 + Math.sin(t * 0.15 + f.ph) * stem * 0.12;
    const hx = f.x + lean + sw, hy = f.y - stem + Math.abs(sw) * 0.25;
    ctx.strokeStyle = '#3f7d2a'; ctx.lineWidth = 1.5 + d;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.quadraticCurveTo(f.x + (lean + sw) * 0.2, f.y - stem * 0.5, hx, hy); ctx.stroke();
    ctx.fillStyle = '#5aa03a'; ctx.beginPath();
    ctx.ellipse(f.x + (lean + sw) * 0.2 + 3, f.y - stem * 0.4, 3 + d * 2, 1.6 + d, -0.5, 0, 7); ctx.fill();
    if (f.kind === 0) bloom(ctx, hx, hy, R, 5, '#7ea6ec', '#5a82cc', '#f8d23a');
    else if (f.kind === 1) bloom(ctx, hx, hy, R, 8, '#ffffff', '#cfd8dc', '#f6c928');
    else if (f.kind === 2) bloom(ctx, hx, hy, R, 5, '#ff9ec7', '#d6609a', '#fff3b0');
    else bloom(ctx, hx, hy, R * 0.9, 6, '#ffd93b', '#e0a800', '#e08a00');
  });

}

// ---------- bouquet de myosotis ----------
function blossom(cx, cy, R, rot) {
  for (let i = 0; i < 5; i++) {                      // 5 pétales bleus
    const a = rot + i * 2 * Math.PI / 5;
    ctx.beginPath(); ctx.arc(cx + 0.58 * R * Math.cos(a), cy + 0.58 * R * Math.sin(a), 0.5 * R, 0, 7);
    ctx.fillStyle = '#7ea6ec'; ctx.fill();

  }
  ctx.fillStyle = '#f3f7ff'; ctx.beginPath(); ctx.arc(cx, cy, 0.36 * R, 0, 7); ctx.fill();   // anneau blanc
  ctx.fillStyle = '#f8d23a'; ctx.beginPath(); ctx.arc(cx, cy, 0.25 * R, 0, 7); ctx.fill();   // coeur jaune
  ctx.fillStyle = '#c0711c'; ctx.beginPath(); ctx.arc(cx, cy, 0.08 * R, 0, 7); ctx.fill();
}
const FL = [[-14, -40, 10], [14, -40, 10], [0, -34, 9], [0, -49, 11], [-8, -59, 10], [9, -58, 10]];
function bouquet(ox, oy, phi, k, n = 6) {
  const full = n >= 6;                   // (ox, oy) = bout des tiges, k = taille
  ctx.save(); ctx.translate(ox, oy); ctx.rotate(phi); ctx.scale(k * 1.4, k * 1.4);
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#3f8f3a'; ctx.lineWidth = 2.6;  // tiges
  FL.slice(0, n).forEach(([cx, cy]) => {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(cx * 0.3, cy * 0.5, cx, cy + 4); ctx.stroke();
  });
  ctx.fillStyle = '#4caf50'; ctx.strokeStyle = '#2e7d32'; ctx.lineWidth = 1;   // feuilles
  (full ? [[-9, -24, -0.9], [9, -28, 0.9]] : []).forEach(([lx, ly, r]) => {
    ctx.beginPath(); ctx.ellipse(lx, ly, 9, 4, r, 0, 7); ctx.fill(); ctx.stroke();
  });
  ctx.strokeStyle = '#e57aa8'; ctx.lineWidth = 5;    // ruban
  if (full) { ctx.beginPath(); ctx.moveTo(-5, -12); ctx.lineTo(5, -12); ctx.stroke(); }
  ctx.fillStyle = '#c48bd0';                         // boutons roses
  (full ? [[-22, -37], [23, -39], [-1, -68]] : []).forEach(([px, py]) => {
    ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();

  FL.slice(0, n).forEach(([cx, cy, R], i) => blossom(cx, cy, R, i * 0.7));

// ---------- écharpe rouge de Mikasa : deux pans simulés (cordes) qui suivent les mouvements et le vent ----------
const SCARF_L = [0.395, 0.515], SCARF_R = [0.615, 0.492];       // extrémités du cou (fractions de l'image)
const TAILS = [{ n: 10, seg: 10, w: 15, off: [3, 3] }, { n: 7, seg: 9, w: 12, off: [5, 8] }].map(o => ({ ...o, p: [] }));

const footY = () => GROUND + 7 * (1 - so / W) + 12 * (so / W);                 // ses pattes sont posées au milieu du sentier en montagne
function neckWorld() {                                          // point du cou (côté nuque) dans l'écran
  const sc = SH / img.height, c = Math.cos(tilt), s = Math.sin(tilt);
  const px = SCARF_L[0] * img.width - img.width / 2, py = SCARF_L[1] * img.height - img.height;
  return [sx + sc * (c * px - s * py), footY() - hop + sc * (s * px + c * py)];
}
function updateScarf() {
  const [ax, ay] = neckWorld();
  TAILS.forEach(T => {
    if (!T.p.length) for (let i = 0; i < T.n; i++) T.p.push({ x: ax, y: ay + i * T.seg, px: ax, py: ay + i * T.seg });
    for (let i = 1; i < T.n; i++) {                              // inertie + gravité + frottement de l'air (vent)
      const q = T.p[i], vx = q.x - q.px, vy = q.y - q.py;
      q.px = q.x; q.py = q.y;
      q.x += vx + 0.12 * (wind(q.x) * 1.4 - vx);
      q.y += vy + 0.28 - 0.12 * vy + Math.sin(t * 0.35 - i * 0.9) * 0.1 * i / T.n;
    }
    T.p[0].x = ax + T.off[0]; T.p[0].y = ay + T.off[1];          // le pan est accroché au cou
    for (let it = 0; it < 5; it++) for (let i = 1; i < T.n; i++) {   // la longueur des segments reste constante
      const a = T.p[i - 1], b = T.p[i];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, f = (d - T.seg) / d;
      if (i === 1) { b.x -= dx * f; b.y -= dy * f; }
      else { a.x += dx * f / 2; a.y += dy * f / 2; b.x -= dx * f / 2; b.y -= dy * f / 2; }
    }
  });
}
function drawTails() {
  ctx.lineJoin = 'round';
  TAILS.forEach(T => {
    const P = T.p, L = [], R = [];
    for (let i = 0; i < T.n; i++) {
      const a = P[Math.max(0, i - 1)], b = P[Math.min(T.n - 1, i + 1)];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, hw = T.w * (1 - 0.4 * i / (T.n - 1)) / 2;
      L.push([P[i].x - dy / d * hw, P[i].y + dx / d * hw]); R.push([P[i].x + dy / d * hw, P[i].y - dx / d * hw]);

function scarfWrap(w, h, k) {                                    // enroulement autour du cou
  const P = f => [f[0] * w - w / 2, f[1] * h - h];
  const [lx, ly] = P(SCARF_L), [rx, ry] = P(SCARF_R);
  ctx.lineCap = 'round';
  [['#7a0f0f', 23], ['#c62828', 18]].forEach(([c, lw]) => {
    ctx.strokeStyle = c; ctx.lineWidth = lw * k;
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(rx, ry); ctx.stroke();
  });
  ctx.strokeStyle = '#e2504f'; ctx.lineWidth = 3 * k;
  ctx.beginPath(); ctx.moveTo(lx + 4 * k, ly - 4 * k); ctx.lineTo(rx - 4 * k, ry - 4 * k); ctx.stroke();
  ctx.lineCap = 'butt';
}

const ENV_REST = GROUND + 30, ENV_HELD = -0.35;
let ex = 0, ey = 0, evx = 0, evy = 0, eang = ENV_HELD, escale = 1, ebounce = 0;
let bLanded = false, eLanded = false, envHidden = false;
function envelope(cx, cy, ang, k, hot) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang); ctx.scale(k, k);
  if (hot) {                                         // halo doux quand on peut cliquer
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
    g.addColorStop(0, 'rgba(255,244,160,0.85)'); g.addColorStop(1, 'rgba(255,244,160,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 40, 0, 7); ctx.fill();
  }
  ctx.lineJoin = 'round'; ctx.lineWidth = 1.5; ctx.strokeStyle = '#a98a55';
  ctx.fillStyle = '#f7ecd0'; ctx.beginPath(); ctx.rect(-17, -12, 34, 24); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-17, 12); ctx.lineTo(-3, 1); ctx.moveTo(17, 12); ctx.lineTo(3, 1); ctx.stroke();
  ctx.fillStyle = '#efdfb8'; ctx.beginPath(); ctx.moveTo(-17, -12); ctx.lineTo(0, 3); ctx.lineTo(17, -12);
  ctx.closePath(); ctx.fill(); ctx.stroke();                                    // rabat
  ctx.fillStyle = '#d32f2f'; ctx.beginPath(); ctx.arc(0, 3, 4, 0, 7); ctx.fill(); // sceau
  ctx.restore();
}

const held = () => hasB;
const onGround = () => ['drop', 'ask', 'open', 'happy'].includes(state);

// ---------- logique ----------
function update() {
  t++; hop = 0; updateBirds();
  const ph = t * 0.15;
  amp += ((state === 'walk' ? 1 : 0) - amp) * 0.15;
  tilt = amp * 0.04 * Math.sin(ph);                 // balancement du pas
  if (state === 'walk') {
    x += 3; hop = Math.abs(Math.sin(ph)) * 4;       // petit rebond à chaque pas
    if (x >= STOP_X) { state = 'pause'; timer = 0; }
  } else if (state === 'pause') {
    if (++timer >= 30) {                            // le bouquet ET l'enveloppe tombent ensemble
      const sc = SH / img.height;
      qx = x + (MOUTH[0] * img.width - img.width / 2) * sc;
      qy = footY() + (MOUTH[1] * img.height - img.height) * sc;
      vy = 0; bounces = 0; qphi = HELD; bLanded = false;
      ex = qx + 24; ey = qy + 18; evx = 2.5; evy = 0; eang = ENV_HELD; escale = 1; ebounce = 0; eLanded = false;
      state = 'drop'; hasB = false;
    }
  } else if (state === 'drop') {
    if (!bLanded) {
      vy += 1.2; qy += vy; qphi = Math.min(LYING, qphi + 0.012);
      const rest = GROUND - 26;
      if (qy >= rest) {
        qy = rest;
        if (bounces < 1) { bounces++; vy = -vy * 0.4; } else { qphi = LYING; bLanded = true; }
      }
    }
    if (!eLanded) {
      evy += 1.2; ey += evy; ex += evx;
      eang = Math.min(0.12, eang + 0.035); escale = Math.min(1.25, escale + 0.015);
      if (ey >= ENV_REST) {
        ey = ENV_REST;
        if (ebounce < 1) { ebounce++; evy = -evy * 0.35; evx *= 0.4; }
        else { eLanded = true; evx = 0; eang = 0.12; escale = 1.25; }
      }
    }
    if (bLanded && eLanded) state = 'ask';          // l'enveloppe attend un clic
  } else if (state === 'happy') {
    hop = Math.abs(Math.sin(t * 0.3)) * 25;
    tilt = 0.06 * Math.sin(t * 0.6);
    if (t % 6 === 0) hearts.push([x + 40 + (Math.random() - 0.5) * 100, GROUND - 280, 1.5 + Math.random() * 2]);
    hearts.forEach(h => h[1] -= h[2]);
    hearts = hearts.filter(h => h[1] > -20);
  }
}

  drawSteam(); drawSmoke(); drawBirds(); drawMeadow();
}

const SUM = 1150, HS = 4, MX = 300, HT = [];

const Hf = s => { const i = Math.max(0, Math.min(HT.length - 2, (s + 300) / HS)), j = Math.floor(i); return HT[j] + (HT[j + 1] - HT[j]) * (i - j); };

// ---- flore de la montagne : générée une fois, répartie sur toute la pente ----
const MS0 = -330, MS1 = 2060, TRW = 15;                  // étendue du monde (en s) ; largeur du sentier
const hillD = ws => 58 + 12 * Math.sin(ws * 0.012) + 7 * Math.sin(ws * 0.031 + 1);   // hauteur de la pente herbeuse derrière le sentier
const MF = [['#7ea6ec', '#5a82cc', '#f8d23a', 5], ['#ffffff', '#cfd8dc', '#f6c928', 8], ['#ff9ec7', '#d6609a', '#fff3b0', 5],

(function () {
  let seed = 2024; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;

  for (let i = 0; i < 480; i++) MB.push({ k: 1, s: rs(), d: rnd(), len: 12 + rnd() * 14, f: fk(), ph: rnd() * 6.28 });
  for (let i = 0; i < 100; i++) MB.push({ k: 2, s: rs(), d: 0.1 + rnd() * 0.85, r: 9 + rnd() * 14, tn: Math.floor(rnd() * 3), f: rnd() < 0.55 ? fk() : -1 });

  for (let i = 0; i < 900; i++) MFR.push({ k: 0, s: rs(), e: rnd(), len: 6 + rnd() * 9, n: 3 + Math.floor(rnd() * 3), c: ci(), ph: rnd() * 6.28 });

const pickHead = i => { const fx = MX + PICKS[i][0] - sc_; return [fx, eyf(fx) + TRW - PICKS[i][1]]; };

  const sc = SH / img.height, c = Math.cos(th), s = Math.sin(th);

function pickFlowers() {                             // les myosotis que Snoopy va cueillir, au bord du sentier

  const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);   // lisse les pics
  const mk = brown => { const b = AC.createBuffer(1, AC.sampleRate * 3, AC.sampleRate), d = b.getChannelData(0); let l = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; if (brown) { l = (l + .02 * w) / 1.02; d[i] = l * 3.5; } else d[i] = w; } return b; };
  noiseBuf = mk(false); brownBuf = mk(true);
  const rl = AC.sampleRate * 1.6, ib = AC.createBuffer(2, rl, AC.sampleRate);                       // petite réverbération de plein air
  for (let c = 0; c < 2; c++) { const d = ib.getChannelData(c); for (let i = 0; i < rl; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 3); }
  verb = AC.createConvolver(); verb.buffer = ib; const vg = AC.createGain(); vg.gain.value = .3; verb.connect(vg); vg.connect(master);
  const src = AC.createBufferSource(); src.buffer = brownBuf; src.loop = true;                      // vent : bruit grave, en rafales lentes
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650; f.Q.value = .4;
  windG = AC.createGain(); windG.gain.value = WIND_TOWN;
  const l1 = AC.createOscillator(), g1 = AC.createGain(); l1.frequency.value = .09; g1.gain.value = .009; l1.connect(g1); g1.connect(windG.gain); l1.start();
  const l2 = AC.createOscillator(), g2 = AC.createGain(); l2.frequency.value = .13; g2.gain.value = 260; l2.connect(g2); g2.connect(f.frequency); l2.start();
  src.connect(f); f.connect(windG); windG.connect(master); src.start();
  const rs = AC.createBufferSource(); rs.buffer = noiseBuf; rs.loop = true;                       // feuillage : souffle aigu très discret
  const rf = AC.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 1500; rf.Q.value = .5;
  const rg = AC.createGain(); rg.gain.value = .0035;
  const l3 = AC.createOscillator(), g3 = AC.createGain(); l3.frequency.value = .11; g3.gain.value = .003; l3.connect(g3); g3.connect(rg.gain); l3.start();
  rs.connect(rf); rf.connect(rg); rg.connect(master); rs.start();
  chirpLoop();
}
function burst(t0, type, fr, q, vol, len, dest) {    // petit bruit filtré (pas, froissement, tige)
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = fr; f.Q.value = q;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(.012, len / 3)); g.gain.exponentialRampToValueAtTime(.0001, t0 + len);
  s.connect(f); f.connect(g); g.connect(dest || master); s.start(t0, Math.random() * 1.5, len + .02);
}
function birdNote(t0, f0, f1, dur, vol, dest) {          // une note d'oiseau : glissando court + harmonique, enveloppe douce
  const o = AC.createOscillator(), h = AC.createOscillator(), g = AC.createGain(), hg = AC.createGain();
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  h.frequency.setValueAtTime(f0 * 2, t0); h.frequency.exponentialRampToValueAtTime(f1 * 2, t0 + dur); hg.gain.value = .22;
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * .25); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); h.connect(hg); hg.connect(g); g.connect(dest); o.start(t0); h.start(t0); o.stop(t0 + dur + .02); h.stop(t0 + dur + .02);
}
function chirp() {                                   // oiseaux : trois types de chants, plus ou moins loin
  if (!soundOn || document.hidden) return;
  const t0 = AC.currentTime + .02, near = Math.random(), vol = .003 + near * .009;
  const p = AC.createStereoPanner ? AC.createStereoPanner() : AC.createGain(); if (p.pan) p.pan.value = Math.random() * 1.4 - .7;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3500 + near * 3000;    // les lointains sont plus sourds
  p.connect(lp); lp.connect(master); lp.connect(verb);
  const base = 2200 + Math.random() * 1600, kind = Math.floor(Math.random() * 3);
  if (kind === 0) for (let i = 0, n = 2 + Math.floor(Math.random() * 3); i < n; i++) birdNote(t0 + i * .16, base * 1.15, base * .85, .1, vol, p);
  else if (kind === 1) for (let i = 0, n = 6 + Math.floor(Math.random() * 6); i < n; i++) birdNote(t0 + i * .055, base * (1 + .08 * (i % 2)), base * 1.1, .04, vol * .8, p);
  else { birdNote(t0, base * .8, base * 1.3, .14, vol, p); birdNote(t0 + .2, base * 1.3, base * .9, .18, vol, p); }
}
function chirpLoop() { chirp(); setTimeout(chirpLoop, 3500 + Math.random() * (so < W ? 6500 : 10000)); }
function stepSound() {                               // pas amortis sur l'herbe
  if (!soundOn) return; burst(AC.currentTime, 'lowpass', 380 + Math.random() * 300, .5, .02, .12);
}
function pickSound() {                               // tige qui casse + froissement de feuilles
  if (!soundOn) return; const t0 = AC.currentTime;
  burst(t0, 'bandpass', 2200, 1.2, .018, .02); burst(t0 + .03, 'bandpass', 900, 1.2, .012, .09);
}
function openSound() {                               // enveloppe en papier qu'on ouvre : froissements, puis un tout petit tintement
  if (!soundOn) return; const t0 = AC.currentTime;
  for (let i = 0; i < 6; i++) burst(t0 + i * .05 + Math.random() * .03, 'bandpass', 2500 + Math.random() * 3000, .7, .028, .05);
  [[1318, .2], [1976, .3]].forEach(([fr, d]) => {
    const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = fr;
    g.gain.setValueAtTime(.0001, t0 + d); g.gain.exponentialRampToValueAtTime(.011, t0 + d + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .7);
    o.connect(g); g.connect(master); g.connect(verb); o.start(t0 + d); o.stop(t0 + d + .75);
  });
}
const snd = document.getElementById('snd');
function setSound(on) { soundOn = on; master.gain.setTargetAtTime(on ? MASTER : 0, AC.currentTime, .1); snd.textContent = on ? '🔊' : '🔇'; }
snd.onclick = e => { e.stopPropagation(); if (!AC) { initAudio(); setSound(true); } else setSound(!soundOn); };
['click', 'touchend'].forEach(ev => document.addEventListener(ev, e => {       // le navigateur exige un geste pour lancer le son
  if (!AC && e.target !== snd) { initAudio(); setSound(true); } else if (AC && AC.state === 'suspended' && soundOn) AC.resume();
}, { passive: true }));

// ================= Rejouer =================
function reset() {
  x = -120; sx = -120; t = 0; amp = 0; state = 'climb'; timer = 0; hop = 0; tilt = 0; hearts = []; so = 0; sc_ = 0; ht = 0;
  mood = moodT = 0; steam = 0; lookX = lookY = 0; pan = 0; envHidden = false; nF = 0; pt = 0; hasB = false; envOn = false; bLanded = eLanded = false; qphi = HELD;
  TAILS.forEach(T => T.p = []); dust = []; gAng = 0;
  openEl.style.display = 'none'; openEl.className = ''; openEl.style.opacity = ''; openEl.style.transition = '';
  txt.textContent = 'Acceptes-tu ce bouquet de myosotis ?'; txt.className = ''; btns.style.display = ''; note.textContent = '';
  document.getElementById('replay').classList.remove('show');
}
document.getElementById('replay').onclick = reset;

img.onload = () => setInterval(() => { update(); extra(); updateScarf(); draw(); }, 30);

const cvs = document.getElementById('c'), openEl = document.getElementById('open');
const letter = document.getElementById('letter'), txt = document.getElementById('txt');
const btns = document.getElementById('btns'), note = document.getElementById('note');

function overEnvelope(e) {
  const r = cvs.getBoundingClientRect();
  const mx = pan + (e.clientX - r.left) / scl, my = (H - r.height / scl) / 2 + (e.clientY - r.top) / scl;
  return state === 'ask' && Math.abs(mx - ex) < 17 * escale + PAD && Math.abs(my - (ey - 6)) < 12 * escale + PAD;
}
cvs.addEventListener('mousemove', e => { cvs.style.cursor = overEnvelope(e) ? 'pointer' : 'default'; });
cvs.addEventListener('click', e => { if (overEnvelope(e)) openEnvelope(); });

function openEnvelope() {
  if (!AC) { initAudio(); setSound(true); } openSound();                            // l'enveloppe s'ouvre en deux
  envHidden = true; state = 'open'; cvs.style.cursor = 'default';
  openEl.style.display = 'block'; openEl.classList.add('pop');
  setTimeout(() => openEl.classList.add('opened'), 650);
}
document.getElementById('oui').onclick = () => {
  txt.textContent = 'Merci ! Nous avons cueilli ces myosotis rien que pour toi !🌸';
  txt.className = 'final'; btns.style.display = 'none'; note.textContent = '';
  state = 'happy'; ht = 0; moodT = 1;
};
document.getElementById('non').onclick = () => {
  note.textContent = 'Tu devrais peut-être réessayer...';
  moodT = -1; steam += .5; clearTimeout(nt); nt = setTimeout(() => { if (state !== 'happy') moodT = 0; }, 2200);
  letter.classList.remove('shake'); void letter.offsetWidth; letter.classList.add('shake');
};
